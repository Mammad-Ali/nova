name: Build

# Builds the Android APK and the Windows installer in the cloud, so no local
# Android SDK or Windows machine is required. Results are attached to each run
# as artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allows running the workflow manually from the Actions tab

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # The signing key lives in repository secrets; the file itself is never
      # committed. Without it the build still succeeds, falling back to the
      # debug signature.
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore secret set — falling back to the debug signature."
            exit 0
          fi
          mkdir -p android/keys
          echo "$KEYSTORE_B64" | base64 --decode > android/keys/nova-release.p12
          cat > android/key.properties <<EOF
          storeFile=keys/nova-release.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=nova
          keyPassword=$KEYSTORE_PASSWORD
          EOF
          echo "Keystore restored."

      # Split per ABI: each APK is smaller and installs faster.
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      # Upload before verifying: even if the certificate cannot be read, the
      # finished APK must stay available.
      - uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # Confirm the APK carries the release key rather than the debug one
      # (the debug certificate reads CN=Android Debug).
      # apksigner is required here: keytool only understands the legacy JAR
      # signature (v1), while Gradle signs with schemes v2/v3.
      - name: Verify signature
        run: |
          set +e
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in $SDK — skipping verification."
            exit 0
          fi

          CERTS=$("$APKSIGNER" verify --print-certs "$APK" 2>&1)
          echo "$CERTS" | grep -i "certificate DN" || echo "$CERTS" | head -5

          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is signed with the debug key — Play Protect will flag it."
            exit 1
          fi
          echo "Release signature confirmed."

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release

      # Ship a single installer instead of a folder of DLLs, so it is obvious
      # what to click.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc windows\installer\nova.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
          Get-ChildItem build\windows\installer

      - uses: actions/upload-artifact@v4
        with:
          name: nova-windows-setup
          path: build/windows/installer/Nova-Setup.exe
          if-no-files-found: error
          retention-days: 30
