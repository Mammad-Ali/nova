name: Build

# Builds Nova for every platform in the cloud, so no local Android SDK,
# Windows machine or Mac is needed:
#
#   * every push to main  — checks, installers as run artifacts, and the web
#                           version published to GitHub Pages;
#   * every tag v1.2.3    — the same, plus a GitHub Release carrying the
#                           installers under fixed names, so the links in the
#                           README always point at the newest version, and an
#                           email to everyone who asked for one
#                           (update-emails.yml).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch: # allows running the workflow manually from the Actions tab

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Tests tagged `network` move real traffic to Cloudflare and Netflix's
      # CDN; a CDN hiccup must not fail a build, so they run locally only.
      - run: flutter test --exclude-tags network

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # The signing key lives in repository secrets; the file itself is never
      # committed. Without it the build still succeeds, falling back to the
      # debug signature.
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore secret set — falling back to the debug signature."
            exit 0
          fi
          mkdir -p android/keys
          echo "$KEYSTORE_B64" | base64 --decode > android/keys/nova-release.p12
          cat > android/key.properties <<EOF
          storeFile=keys/nova-release.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=nova
          keyPassword=$KEYSTORE_PASSWORD
          EOF
          echo "Keystore restored."

      # The Firebase project and Google sign-in clients, from the
      # NOVA_CLOUD_CONFIG repository secret (GitHub refuses pushes that
      # contain Google keys). Without the secret the build still succeeds,
      # with the local demo account instead of the cloud.
      - name: Cloud configuration
        shell: bash
        env:
          NOVA_CLOUD_CONFIG: ${{ secrets.NOVA_CLOUD_CONFIG }}
        run: |
          if [ -n "$NOVA_CLOUD_CONFIG" ]; then
            printf '%s' "$NOVA_CLOUD_CONFIG" > nova_cloud.json
            echo "DEFINES=--dart-define-from-file=nova_cloud.json" >> "$GITHUB_ENV"
            echo "Cloud configuration written."
          else
            echo "No NOVA_CLOUD_CONFIG secret: building with the demo account."
          fi

      # Split per ABI: each APK is smaller and installs faster.
      - name: Build APK
        run: flutter build apk --release --split-per-abi $DEFINES

      - name: Build universal APK
        run: flutter build apk --release $DEFINES

      # Upload before verifying: even if the certificate cannot be read, the
      # finished APK must stay available.
      - uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # Confirm the APK carries the release key rather than the debug one
      # (the debug certificate reads CN=Android Debug).
      # apksigner is required here: keytool only understands the legacy JAR
      # signature (v1), while Gradle signs with schemes v2/v3.
      - name: Verify signature
        run: |
          set +e
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in $SDK — skipping verification."
            exit 0
          fi

          CERTS=$("$APKSIGNER" verify --print-certs "$APK" 2>&1)
          echo "$CERTS" | grep -i "certificate DN" || echo "$CERTS" | head -5

          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is signed with the debug key — Play Protect will flag it."
            exit 1
          fi
          echo "Release signature confirmed."

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The Firebase project and Google sign-in clients, from the
      # NOVA_CLOUD_CONFIG repository secret (GitHub refuses pushes that
      # contain Google keys). Without the secret the build still succeeds,
      # with the local demo account instead of the cloud.
      - name: Cloud configuration
        shell: bash
        env:
          NOVA_CLOUD_CONFIG: ${{ secrets.NOVA_CLOUD_CONFIG }}
        run: |
          if [ -n "$NOVA_CLOUD_CONFIG" ]; then
            printf '%s' "$NOVA_CLOUD_CONFIG" > nova_cloud.json
            echo "DEFINES=--dart-define-from-file=nova_cloud.json" >> "$GITHUB_ENV"
            echo "Cloud configuration written."
          else
            echo "No NOVA_CLOUD_CONFIG secret: building with the demo account."
          fi
      - name: Build
        shell: bash
        run: flutter build windows --release $DEFINES

      # Ship a single installer instead of a folder of DLLs, so it is obvious
      # what to click. The version shown in "Apps & features" comes from
      # pubspec.yaml, the same place every other platform reads it from.
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$version" windows\installer\nova.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
          Get-ChildItem build\windows\installer

      - uses: actions/upload-artifact@v4
        with:
          name: nova-windows-setup
          path: build/windows/installer/Nova-Setup.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The Firebase project and Google sign-in clients, from the
      # NOVA_CLOUD_CONFIG repository secret (GitHub refuses pushes that
      # contain Google keys). Without the secret the build still succeeds,
      # with the local demo account instead of the cloud.
      - name: Cloud configuration
        shell: bash
        env:
          NOVA_CLOUD_CONFIG: ${{ secrets.NOVA_CLOUD_CONFIG }}
        run: |
          if [ -n "$NOVA_CLOUD_CONFIG" ]; then
            printf '%s' "$NOVA_CLOUD_CONFIG" > nova_cloud.json
            echo "DEFINES=--dart-define-from-file=nova_cloud.json" >> "$GITHUB_ENV"
            echo "Cloud configuration written."
          else
            echo "No NOVA_CLOUD_CONFIG secret: building with the demo account."
          fi
      - run: flutter build macos --release $DEFINES

      # Ad-hoc signature with the release entitlements, then a check of the
      # two signatures that matter: the app runs outside the App Sandbox,
      # where it can see per-app traffic and the ARP table, and the widget
      # extension inside it, or macOS won't load the widgets.
      - name: Sign and check entitlements
        run: |
          APP=build/macos/Build/Products/Release/Nova.app
          codesign --force --sign - --entitlements macos/Runner/Release.entitlements "$APP"
          sandboxed() {
            codesign -d --entitlements - --xml "$1" 2>/dev/null \
              | grep -Eq 'app-sandbox</key>[[:space:]]*<true/>'
          }
          if sandboxed "$APP"; then
            echo "::error::the app is signed into the sandbox"
            exit 1
          fi
          if ! sandboxed "$APP/Contents/PlugIns/NovaWidgets.appex"; then
            echo "::error::the widget extension is not sandboxed: macOS would not load it"
            exit 1
          fi
          echo "App outside the sandbox, widget extension inside it."

      # A disk image with the app next to a link to Applications: open it,
      # drag one icon onto the other — the way Mac apps are installed.
      - name: Build disk image
        run: |
          mkdir -p dmg
          cp -R build/macos/Build/Products/Release/Nova.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Nova -srcfolder dmg -ov -format UDZO Nova-macOS.dmg

      # The in-app update (Sparkle): the same app as a zip, signed with the
      # EdDSA key in the SPARKLE_PRIVATE_KEY secret; the app only accepts
      # updates carrying that signature. Releases only. sign_update comes from
      # Sparkle's own release, checked against its published SHA-256.
      - name: Sign the in-app update
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "No SPARKLE_PRIVATE_KEY secret: this release has no in-app update."
            exit 0
          fi
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/Nova.app Nova-macOS.zip
          curl -sSfL -o sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz
          echo "1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  sparkle.tar.xz" | shasum -a 256 -c -
          mkdir sparkle && tar -xf sparkle.tar.xz -C sparkle
          printf '%s' "$SPARKLE_PRIVATE_KEY" > sparkle.key
          ./sparkle/bin/sign_update --ed-key-file sparkle.key Nova-macOS.zip > Nova-macOS.zip.sig
          rm -P sparkle.key
          cat Nova-macOS.zip.sig

      - uses: actions/upload-artifact@v4
        with:
          name: nova-macos
          path: |
            Nova-macOS.dmg
            Nova-macOS.zip
            Nova-macOS.zip.sig
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # The Firebase project and Google sign-in clients, from the
      # NOVA_CLOUD_CONFIG repository secret (GitHub refuses pushes that
      # contain Google keys). Without the secret the build still succeeds,
      # with the local demo account instead of the cloud.
      - name: Cloud configuration
        shell: bash
        env:
          NOVA_CLOUD_CONFIG: ${{ secrets.NOVA_CLOUD_CONFIG }}
        run: |
          if [ -n "$NOVA_CLOUD_CONFIG" ]; then
            printf '%s' "$NOVA_CLOUD_CONFIG" > nova_cloud.json
            echo "DEFINES=--dart-define-from-file=nova_cloud.json" >> "$GITHUB_ENV"
            echo "Cloud configuration written."
          else
            echo "No NOVA_CLOUD_CONFIG secret: building with the demo account."
          fi
      # Served from https://mammad-ali.github.io/nova/, so every asset path
      # has to be relative to /nova/ rather than the domain root.
      - run: flutter build web --release --base-href /nova/ $DEFINES
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    name: Publish website
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [analyze, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [analyze, android, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nova-*
          path: dist

      # Fixed names on purpose: GitHub serves the newest release's files at
      # releases/latest/download/<name>, so links in the README never go
      # stale.
      - name: Name the files
        run: |
          mkdir -p out
          cp dist/nova-apk/app-arm64-v8a-release.apk out/Nova-Android.apk
          cp dist/nova-apk/app-release.apk out/Nova-Android-universal.apk
          cp dist/nova-windows-setup/Nova-Setup.exe out/Nova-Windows-Setup.exe
          cp dist/nova-macos/Nova-macOS.dmg out/Nova-macOS.dmg
          ls -lh out

      # Sparkle's feed, published with the release so that
      # releases/latest/download/appcast.xml — the address in the Mac app —
      # always describes the newest version.
      - name: In-app update feed
        run: |
          if [ ! -f dist/nova-macos/Nova-macOS.zip.sig ]; then
            echo "No signed update in this build: no feed."
            exit 0
          fi
          cp dist/nova-macos/Nova-macOS.zip out/Nova-macOS.zip
          python3 tool/make_appcast.py --tag "$GITHUB_REF_NAME" \
            --signature "$(cat dist/nova-macos/Nova-macOS.zip.sig)" > out/appcast.xml
          cat out/appcast.xml

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Nova ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md

  # After the release is out, tell the people who asked to hear about it.
  emails:
    name: Email subscribers
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/update-emails.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
