name: Build

# Собирает Android APK (и проверяет код) в облаке GitHub — локальный
# Android SDK для этого не нужен. Готовый APK лежит в артефактах запуска.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # можно запустить вручную кнопкой в разделе Actions

jobs:
  analyze:
    name: Анализ и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # Разбиваем по ABI: каждый APK меньше и ставится быстрее.
      # Сборка debug-подписью — для установки «для себя» этого достаточно.
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30
