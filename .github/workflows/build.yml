name: Build

# Собирает Android APK (и проверяет код) в облаке GitHub — локальный
# Android SDK для этого не нужен. Готовый APK лежит в артефактах запуска.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # можно запустить вручную кнопкой в разделе Actions

jobs:
  analyze:
    name: Анализ и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # Ключ подписи хранится в секретах репозитория: сам файл в git не
      # лежит. Без него сборка не падает, а просто уходит на debug-подпись.
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Секрет с ключом не задан — сборка уйдёт на debug-подпись."
            exit 0
          fi
          mkdir -p android/keys
          echo "$KEYSTORE_B64" | base64 --decode > android/keys/nova-release.p12
          cat > android/key.properties <<EOF
          storeFile=keys/nova-release.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=nova
          keyPassword=$KEYSTORE_PASSWORD
          EOF
          echo "Ключ восстановлен."

      # Разбиваем по ABI: каждый APK меньше и ставится быстрее.
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      # Подтверждаем, что APK подписан нашим ключом, а не отладочным:
      # у отладочного в сертификате стоит CN=Android Debug. keytool берём из
      # JDK, который уже поставил setup-java — он есть всегда.
      - name: Verify signature
        run: |
          OWNER=$("$JAVA_HOME/bin/keytool" -printcert -jarfile \
            build/app/outputs/flutter-apk/app-release.apk \
            | grep -m1 "Owner:")
          echo "Подписано: $OWNER"
          if echo "$OWNER" | grep -qi "Android Debug"; then
            echo "::error::APK подписан отладочным ключом — Play Защита будет ругаться."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: pulsar-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30
